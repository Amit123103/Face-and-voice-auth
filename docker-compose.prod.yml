# ═══════════════════════════════════════════
# Docker Compose — Production
# Immutable containers, resource limits, secrets
# ═══════════════════════════════════════════

version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: facevoiceauth-backend-prod
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
    env_file:
      - .env.prod
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fva-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: facevoiceauth-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    depends_on:
      - backend
    restart: always
    networks:
      - fva-prod

  postgres:
    image: postgres:16-alpine
    container_name: facevoiceauth-postgres-prod
    environment:
      POSTGRES_DB: facevoiceauth
      POSTGRES_USER: fva_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fva_user -d facevoiceauth"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - fva-prod
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: facevoiceauth-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - fva-prod
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  postgres_prod_data:

networks:
  fva-prod:
    driver: bridge
