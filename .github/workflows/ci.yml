# ═══════════════════════════════════════════
# GitHub Actions — CI Workflow
# Lint → Test → Build Docker → Security Scan
# ═══════════════════════════════════════════

name: CI Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('backend/requirements.txt') }}

      - name: Install lint tools
        run: pip install flake8 black isort

      - name: Run flake8
        run: flake8 backend/ --max-line-length=120 --exclude=__pycache__

      - name: Run black
        run: black --check --line-length=120 backend/

      - name: Run isort
        run: isort --check-only --profile black backend/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt || pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy aiosqlite python-jose bcrypt pyotp qrcode cryptography numpy slowapi httpx python-multipart pytest pytest-asyncio pytest-mock pytest-cov opencv-python-headless

      - name: Run tests
        run: |
          pytest backend/tests/ \
            --cov=backend \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml \
            -v --tb=short
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          ENVIRONMENT: test

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t facevoiceauth-backend:test .

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t facevoiceauth-frontend:test .

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: pip install bandit safety

      - name: Run Bandit
        run: bandit -r backend/ -ll -ii -f json -o bandit-results.json || true

      - name: Run Safety
        run: safety check -r backend/requirements.txt --output json > safety-results.json || true

      - name: Upload security results
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-results.json
            safety-results.json
